# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false


## Environment Properties

# Minecraft version
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)

# NeoForge version (UPDATE to the build you target)
neo_version=21.1.95
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mod dependency versions
# Curios (Modrinth maven — confirmed)
curios_version=9.5.1+1.21.1

# Create stack (createmod.net maven). Versions tracked on
# https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
# If a resolve fails, update the matching line below.
create_version = 6.0.10-280
ponder_version = 1.0.82
flywheel_version = 1.0.6
registrate_version = MC1.21-1.3.0+67

# Numismatics (Modrinth maven — version_number must match exactly).
# If Gradle can't find this, open the Modrinth release page for the
# NeoForge 1.21.1 build and copy its "Version number" field here.
numismatics_version=1.0.20+neoforge-mc1.21.1


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=numismatics_utils
# The human-readable display name for the mod.
mod_name=Create: Numismatics Utils
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=LGPL
# The mod version. See https://semver.org/
mod_version=2.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=io.github.chakyl.numismaticsutils
# The authors of the mod.
mod_authors=Chakyl
# The description of the mod.
mod_description=Utilities for Create Numismatics
